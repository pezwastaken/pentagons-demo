<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixpoint Visualizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            display: flex;
            height: 100vh;
            color: #222;
            background: #fff;
        }
        /* Left panel for buttons */
        .sidebar {
            width: 220px;
            border-right: 1px solid #ccc;
            padding: 12px;
            background: #f8f9fa;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .sidebar button {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 14px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            border-radius: 4px;
        }
        .sidebar button:hover { background: #e9ecef; }
        .sidebar button.active { background: #0066cc; color: #fff; border-color: #0066cc; }

        /* Right scrollable content panel */
        .content-panel {
            flex-grow: 1;
            padding: 32px 40px; /* Generous spacing between buttons and content */
            overflow-y: auto;
            line-height: 1.6;
        }
        .content-section { display: none; }
        .content-section.active { display: block; }
        .content-section h2 { margin-bottom: 12px; }
        .content-section p {
            margin-bottom: 16px;
            white-space: pre-wrap; /* Preserves formatting/newlines from state dumps */
            font-family: monospace; /* Great for dump visualization */
        }
    </style>
</head>
<body>
<div class="sidebar">
  <button onclick="showSection('section0')" id="btn-section0" class="active">node 0</button>
  <button onclick="showSection('section1')" id="btn-section1" class="">node 1</button>
  <button onclick="showSection('section2')" id="btn-section2" class="">node 2</button>
  <button onclick="showSection('section3')" id="btn-section3" class="">node 3</button>
</div>
<div class="content-panel">
  <div id="section0" class="content-section active">
    <h2>Node 0</h2>
    <p>[ BOT ]</p>
  </div>
  <div id="section1" class="content-section ">
    <h2>Node 1</h2>
    <p>[
]
</p>
  </div>
  <div id="section2" class="content-section ">
    <h2>Node 2</h2>
    <p>[
	a = [ 0, 0 ] 
]
</p>
  </div>
  <div id="section3" class="content-section ">
    <h2>Node 3</h2>
    <p>[
	a = [ 0, 0 ] 
	b = [ 1, 1 ] 
]
</p>
  </div>
</div>
<script>
function showSection(sectionId) {
    const sections = document.querySelectorAll('.content-section');
    sections.forEach(section => { section.classList.remove('active'); });

    const buttons = document.querySelectorAll('.sidebar button');
    buttons.forEach(button => { button.classList.remove('active'); });

    const targetSection = document.getElementById(sectionId);
    if (targetSection) { targetSection.classList.add('active'); }

    const targetButton = document.getElementById('btn-' + sectionId);
    if (targetButton) { targetButton.classList.add('active'); }
}
</script>
</body>
</html>
